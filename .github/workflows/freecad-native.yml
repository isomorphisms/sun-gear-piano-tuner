name: FreeCAD native adapter tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freecad-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install actual FreeCAD runtime (Ubuntu 22.04 universe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freecad python3
          command -v FreeCADCmd || command -v freecadcmd || command -v freecad
      - name: Native FreeCAD recompute, shape, save/reopen and STEP tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 10m bash tests/run_freecad.sh
      - name: Upload test log and manifest even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecad-native-test-report
          path: build/freecad-test/
          if-no-files-found: warn
